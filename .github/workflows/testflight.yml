name: TestFlight

# Manual for now; switch to tags once the first build has gone through.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [ios, mac, both]
        default: ios

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    strategy:
      matrix:
        lane: [ios, mac]
    steps:
      - name: Skip unselected platform
        if: inputs.platform != 'both' && inputs.platform != matrix.lane
        run: echo "skipping ${{ matrix.lane }}"
      - uses: actions/checkout@v4
        if: inputs.platform == 'both' || inputs.platform == matrix.lane
      - uses: maxim-lobanov/setup-xcode@v1
        if: inputs.platform == 'both' || inputs.platform == matrix.lane
        with:
          xcode-version: latest-stable
      - name: Build and upload
        if: inputs.platform == 'both' || inputs.platform == matrix.lane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_REPO_TOKEN: ${{ secrets.MATCH_REPO_TOKEN }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
          LANE: ${{ matrix.lane }}
        run: |
          brew install xcodegen
          # Firebase config is not in the public repo.
          if [ -n "$FIREBASE_PLIST_BASE64" ]; then
            printf '%s' "$FIREBASE_PLIST_BASE64" | base64 --decode > Config/GoogleService-Info.plist
          fi
          xcodegen generate
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_KEY_CONTENT_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          # Access to the private signing repo: a read-only deploy key
          # (preferred) or a fine-grained token with Contents: read.
          if [ -n "$MATCH_DEPLOY_KEY" ]; then
            eval "$(ssh-agent -s)"
            printf '%s\n' "$MATCH_DEPLOY_KEY" | ssh-add -
            mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            export MATCH_GIT_URL="git@github.com:yakupad/apple-signing.git"
          else
            export MATCH_GIT_BASIC_AUTHORIZATION=$(printf 'x-access-token:%s' "$MATCH_REPO_TOKEN" | base64)
          fi
          export MATCH_KEYCHAIN_NAME=ci.keychain MATCH_KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$MATCH_KEYCHAIN_NAME"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$MATCH_KEYCHAIN_NAME"
          security list-keychains -d user -s "$MATCH_KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')
          fastlane "$LANE" beta
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
