name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Core logic tests
        working-directory: Packages/ToolpathKit
        run: swift test
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS
        run: xcodebuild -project Toolpath.xcodeproj -scheme Toolpath -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Build macOS
        run: xcodebuild -project Toolpath.xcodeproj -scheme Toolpath -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build | tail -20
