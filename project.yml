name: Toolpath
options:
  bundleIdPrefix: com.yakupad
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: D677J9K7QY
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  ToolpathKit:
    path: Packages/ToolpathKit
targets:
  Toolpath:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: ToolpathKit
        product: CNCKit
      - package: ToolpathKit
        product: CNCDesign
      - package: ToolpathKit
        product: CNCRender
      - package: ToolpathKit
        product: ToolpathActivity
      - target: ToolpathWidgets
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.toolpath
        PRODUCT_NAME: Toolpath
        INFOPLIST_KEY_CFBundleDisplayName: Toolpath
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Toolpath reads the status of your CNC controller on your local network (read-only)."
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Toolpath-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Entitlements/Toolpath-macOS.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleLocalizations: [en, tr, de, es, it, ru, ja, zh-Hans, ar]
        UIBackgroundModes: [remote-notification]
        CFBundleDocumentTypes:
          - CFBundleTypeName: G-code
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.yakupad.toolpath.gcode]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.yakupad.toolpath.gcode
            UTTypeDescription: G-code program
            UTTypeConformsTo: [public.plain-text, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nc, gcode, ngc, tap, cnc, gc, nc1]
  ToolpathWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: ToolpathKit
        product: CNCDesign
      - package: ToolpathKit
        product: ToolpathActivity
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.toolpath.widgets
        PRODUCT_NAME: ToolpathWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Toolpath
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/ToolpathWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Toolpath:
    build:
      targets:
        Toolpath: all
    run:
      storeKitConfiguration: Config/Toolpath.storekit
    test:
      gatherCoverageData: false
